<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebAR Fachada - Chroma Key</title>
    <!-- Librerías de A-Frame y MindAR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- Librería de Chroma Key para eliminar el fondo verde -->
    <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene 
      mindar-image="imageTargetSrc: targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Video optimizado con fondo verde -->
        <video 
          id="video-ventanas" 
          src="ventanas.mp4" 
          preload="auto" 
          loop 
          muted 
          playsinline 
          webkit-playsinline 
          crossorigin="anonymous">
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

     <!-- Plano ajustado con tamaño pequeño -->
      <a-entity id="target-fachada" mindar-image-target="targetIndex: 0">
        <a-video 
          src="#video-ventanas" 
          material="shader: chromakey; color: 0.0 1.0 0.0" 
          position="0 0 0" 
          height="0.2" 
          width="0.8" 
          rotation="0 0 0">
        </a-video>
      </a-entity>
      
    </a-scene>

    <script>
      const targetEl = document.querySelector('#target-fachada');
      const videoEl = document.querySelector('#video-ventanas');

      targetEl.addEventListener('targetFound', () => {
        videoEl.play().catch(error => {
          console.log("Error al reproducir el video:", error);
        });
      });

      targetEl.addEventListener('targetLost', () => {
        videoEl.pause();
      });

      videoEl.addEventListener('error', (e) => {
        console.log("Error cargando el archivo de video. Revisa el nombre en GitHub:", e);
      });
    </script>
  </body>
</html>
